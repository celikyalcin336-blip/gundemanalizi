name: X (Twitter) 7/24 Auto Poster

on:
  schedule:
    # Yoğunluk olmayan dakikalarda her 10 dakikada bir kontrol (Sıfır GitHub kuyruk gecikmesi)
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch: # GitHub panelinden tek tıkla manuel tetikleme butonu

permissions:
  contents: write

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow feedparser python-dotenv playwright requests-oauthlib
          python -m playwright install chromium --with-deps

      - name: X (Twitter) Seçici Paylaşım Döngüsünü Çalıştır
        env:
          SITE_URL: "https://xn--gndemanalizi-dlb.com.tr"
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          X_COOLDOWN_MINUTES: "28.0"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u run_x_cycle.py

      - name: Paylaşım Geçmişini Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_posted_history.json
          git diff --staged --quiet || (git commit -m "chore: update x_posted_history [skip ci]" && git pull --rebase origin main && git push origin main) || true
