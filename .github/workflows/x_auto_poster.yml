name: X (Twitter) 7/24 Auto Poster

on:
  schedule:
    # Her 10 dakikada bir kontrol eder (50 dakika dolduğunda anında paylaşır - Neon yükü %0)
    - cron: '*/10 * * * *'
  workflow_dispatch: # GitHub panelinden tek tıkla manuel tetikleme butonu

permissions:
  contents: write

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow feedparser python-dotenv playwright requests-oauthlib
          python -m playwright install chromium --with-deps

      - name: X (Twitter) Seçici Paylaşım Döngüsünü Çalıştır
        env:
          SITE_URL: "https://xn--gndemanalizi-dlb.com.tr"
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
          X_COOLDOWN_MINUTES: "50.0"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u run_x_cycle.py

      - name: Paylaşım Geçmişini Kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add x_posted_history.json || true
          git diff --staged --quiet || (git commit -m "chore: update x_posted_history [skip ci]" && git push) || true
