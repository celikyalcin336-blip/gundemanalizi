name: X (Twitter) 7/24 Auto Poster

on:
  schedule:
    # Her 45 dakikada bir çalışır (Günde ~20 kaliteli tweet)
    - cron: '*/45 * * * *'
  workflow_dispatch: # GitHub panelinden tek tıkla manuel tetikleme butonu

permissions:
  contents: write

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow feedparser python-dotenv playwright
          playwright install chromium --with-deps

      - name: X (Twitter) Seçici Paylaşım Döngüsünü Çalıştır
        env:
          SITE_URL: "https://www.gündemanalizi.com.tr"
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN || '2a76b61426aa6fd6cddcb13505801653449db92f' }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 || '48afdd1c4cdaae9ffc2d2e8a66a03a5ca00489c3ffbe9cfa2bce7a79f75b4ce33315568bb0b93778cb8d5112dd46b2f850de0cf2d29bd463d41960a926ebaf0bdba5e6d104ca10b3593132b4c992781a' }}
          X_COOLDOWN_MINUTES: "45.0"
        run: |
          python run_x_cycle.py

      - name: Paylaşım Geçmişini Kaydet
        if: always()
        run: |
          git config user.name "Gundem Bot"
          git config user.email "bot@gundemanalizi.com.tr"
          git add x_posted_history.json || true
          git commit -m "chore: update x_posted_history [skip ci]" || true
          git push || true
