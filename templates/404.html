<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı (404) | Gündem Analizi</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="/assets/style.min.css">
    <script src="/assets/lucide.min.js" defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc !important; color: #0f172a !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-red-600 selection:text-white">
    <header class="border-b border-slate-200 bg-white/95 backdrop-blur sticky top-0 z-50 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <img src="/assets/logo-128.png" width="40" height="40" alt="Logo" class="w-10 h-10 rounded-full border-2 border-red-600 shadow-xs" onerror="this.onerror=null;this.src='/assets/logo.png';">
                <div>
                    <span class="text-xl font-black tracking-tight text-slate-900 flex items-center gap-1">
                        GÜNDEM <span class="text-red-600">ANALİZİ</span>
                    </span>
                    <p class="text-[10px] font-bold text-slate-500 tracking-wider uppercase">
                        Doğru Haber • Tarafsız Analiz
                    </p>
                </div>
            </a>
            <a href="/" class="inline-flex items-center gap-1.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-sm transition">
                ← Ana Sayfa
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-16 flex-1 flex flex-col items-center justify-center text-center">
        <div class="w-24 h-24 rounded-3xl bg-red-50 border-2 border-red-200 flex items-center justify-center mb-6 shadow-sm">
            <span class="text-5xl font-black text-red-600">404</span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">
            Aradığınız Sayfa Bulunamadı
        </h1>
        <p class="text-slate-600 text-sm sm:text-base max-w-lg mb-8 leading-relaxed">
            Ulaşmaya çalıştığınız haber yayından kaldırılmış, bağlantı adresi değişmiş ya da taşınmış olabilir.
        </p>

        <form action="/" method="GET" class="w-full max-w-md mb-8">
            <div class="relative">
                <input type="text" name="q" placeholder="Sitede haber ara (Örn: Ekonomi, Otomobil, Teknoloji)..." class="w-full bg-white border border-slate-300 rounded-xl py-3 pl-4 pr-12 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:border-red-600 shadow-xs">
                <button type="submit" class="absolute right-2 top-2 px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded-lg text-xs font-bold transition">
                    Ara
                </button>
            </div>
        </form>

        <div class="flex flex-wrap items-center justify-center gap-3">
            <a href="/" class="px-5 py-2.5 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold text-sm shadow-sm transition">
                ← Güncel Haberlere Dön
            </a>
            <a href="/?kategori=Ekonomi" class="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold text-sm transition">
                Ekonomi
            </a>
            <a href="/?kategori=Gündem" class="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold text-sm transition">
                Gündem
            </a>
            <a href="/?kategori=Teknoloji" class="px-4 py-2.5 rounded-xl bg-white hover:bg-slate-100 border border-slate-200 text-slate-700 font-bold text-sm transition">
                Teknoloji
            </a>
        </div>
    </main>

    <footer class="border-t border-slate-200 bg-slate-50 py-6 text-center text-xs text-slate-500">
        <p>© 2026 Gündem Analizi. Tüm hakları saklıdır.</p>
    </footer>
</body>
</html>
